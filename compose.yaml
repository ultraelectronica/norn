# Local dev dependencies for the Norn backend. Postgres + Redis only.
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: norn
      POSTGRES_PASSWORD: norn
      POSTGRES_DB: norn
    ports:
      - "5432:5432"
    volumes:
      - norn-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U norn"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  norn-pg:
